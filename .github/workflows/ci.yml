name: ci
on:
  push:
    branches: [main, master]
  pull_request:
jobs:
  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
      - run: npm test -- --run
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with: { name: static-export, path: apps/web/out, retention-days: 7 }
  rules-engine-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python -c "from ml.features import compute_features, FEATURE_NAMES; print(len(FEATURE_NAMES), 'features')"
      - run: python -m synth.cli --out /tmp/synth --n 50 --no-render --seed 1
